<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styleframes/base.css"><link rel="stylesheet" href="../styleframes/apps.css"><link rel="stylesheet" href="world.css">
<style>
  .scrim { position: absolute; left: 0; top: 0; width: 1500px; height: 300px; opacity: 0; backdrop-filter: blur(12px);
    background: linear-gradient(180deg, rgba(244,247,249,.92), rgba(244,247,249,.75) 55%, rgba(244,247,249,0));
    /* Fade to zero at the scrim bounds so the backdrop blur has no hard edge. */
    -webkit-mask-image: radial-gradient(100% 100% at 0% 0%, #000 55%, transparent 100%); }
  .ov-big { position: absolute; left: 110px; font: 700 92px/1.16 var(--sans); letter-spacing: -.02em; color: var(--ink); opacity: 0; }
  .ov-big em { font-style: normal; color: var(--cyan-type); }
  .hudswap { position: absolute; left: 64px; top: 44px; font-size: 22px; color: var(--text-3); text-shadow: 0 0 8px #F4F7F9, 0 0 16px #F4F7F9; }
  .hudswap b { color: var(--cyan-deep); font-weight: 500; }
  #paper { position: absolute; inset: 0; opacity: 0; background: radial-gradient(120% 90% at 50% 40%, var(--paper-2) 0%, var(--paper) 70%, #EBEEF1 100%); }
  #lock { position: absolute; left: 0; right: 0; top: 300px; display: flex; flex-direction: column; align-items: center; }
  #lock .l1 { display: flex; align-items: center; gap: 28px; opacity: 0; }
  #lock .l1 img { width: 120px; height: 120px; }
  #lock .l1 div { font: 700 104px var(--sans); color: var(--ink); letter-spacing: -.01em; }
  #lock .l1 span { font-family: var(--latin); font-weight: 600; letter-spacing: -.025em; }
  #lock .l2 { margin-top: 36px; font: 500 48px var(--sans); color: var(--text); opacity: 0; }
  #lock .l2 em { font-style: normal; color: var(--cyan-type); }
  #lock .l3 { margin-top: 120px; display: flex; gap: 60px; align-items: center; font: 500 32px var(--sans); color: var(--text-2); opacity: 0; }
  #lock .l3 code { font: 500 32px var(--mono); color: var(--cyan-deep); }
  #lock .l3 i { width: 2px; height: 34px; background: #CDD3D8; }
  .loop { position: absolute; left: 0; top: 0; height: 44px; padding: 0 16px; border-radius: 999px; background: #fff; box-shadow: var(--shadow-lift);
    display: flex; align-items: center; gap: 8px; font-size: 20px; white-space: nowrap; border: 1px solid var(--line); opacity: 0; }
  .loop.lmem { border: 2px solid var(--cyan); color: var(--cyan-deep); }
</style>
</head>
<body>
<div id="world"></div>

<div class="scrim" id="scrim"></div>
<div class="hudswap" id="hud" style="opacity:0">OpenViking · <b>记忆跟着人走</b></div>
<div class="ov-big" id="big7" style="top:118px">记忆<em>跟着人走</em></div>
<div class="ov-big" id="big8" style="top:690px;font-size:84px">一个地址，<br><em>全团队</em></div>
<div class="ov-big" id="big9" style="top:118px;font-size:84px">安全与隐私，<em>有保障</em></div>
<div class="corner-tag" id="ctag" style="opacity:0">原理示意 · 时间已压缩</div>
<div id="paper"></div>
<div id="lock">
  <div class="l1"><img src="../assets/ov-mark.svg"><div><span>OpenViking</span> 网关</div></div>
  <div class="l2">改两项设置，让你的应用<em>接上记忆</em></div>
  <div class="l3"><span id="launchLine"></span><i></i><code id="ctaUrl"></code></div>
</div>

<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../node_modules/gsap/dist/MotionPathPlugin.min.js"></script>
<script src="launch.js"></script>
<script src="captions.js"></script>
<script src="world.js"></script>
<!-- shot 06 is built first so that every object starts exactly where 06 leaves it -->
<script src="tl06.js"></script>
<script>
// Shots 07–09 as one continuous take (39 s), placed after shot 06 on the same timeline:
//   07 记忆跟着人走 0–11 · 08 交给团队 11–29 · 09 收束 29–39
$('launchLine').textContent = LAUNCH.launchLine; $('ctaUrl').textContent = LAUNCH.ctaUrl;
const T = 26;                                  // local time 0 = shot 06's last frame
const at = (t) => T + t;
const fadeIn = (sel, t, d = .5) => tl.to(sel, { opacity: 1, duration: d }, at(t));
const fadeOut = (sel, t, d = .5) => tl.to(sel, { opacity: 0, duration: d }, at(t));
const move = (t, cx, cy, s, d = 1.4, ease = 'power3.inOut') => shot(at(t), cx, cy, s, d, ease);
const hud = (t, html) => tl.set('#hud', { innerHTML: html }, at(t));
const W = $('world');
const Q = {
  deploy: wrect($('f_deploymd')), monQ: wrect($('monQ')), yw: wrect($('appYw')), model: wrect($('model')),
  console: { x: 700, y: -1560, w: 1300, h: 820 },
};
gsap.set(['#cloudChip'], { xPercent: -50 });
gsap.set(['.loop'], { xPercent: -50, yPercent: -50 });

// =====================================================================
// 07 · 记忆跟着人走 (0–11)
// =====================================================================
fadeIn(['#hud', '#ctag'], 0, .4);
// tidy shot 06's last state: the panel folds back into the model, the new memory settles into the floor
tl.to('#pc', { opacity: 0, duration: .3 }, at(.15));
tl.to('#model', { left: 2160, top: 390, width: 320, height: 320, borderRadius: 48, duration: .8, ease: 'power3.inOut' }, at(.25));
tl.to('#compact', { opacity: 1, duration: .3 }, at(.85));
tl.to('#sheen', { opacity: 1, duration: .4 }, at(.6));
fadeOut(['#timechip', '#newcard'], .2, .4);
tl.set('#f_memoriesevents2', { innerHTML: '<div class="n">release-followup.md</div><div class="l"></div><div class="l s"></div>', borderStyle: 'solid', borderColor: 'rgba(7,9,13,.07)', background: '#fff' }, at(.6));
fadeOut(['#bubble', '#answer'], .6, .3);
fadeIn('#scrim', .4, .5);
tl.fromTo('#big7', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, at(.5));
// Monday, in the R&D assistant
move(1.0, 620, 600, 1.0, 1.6);
tl.set('#appDay', { textContent: '周一 · 研发助手' }, at(1.0));
fadeIn('#appDay', 1.4, .3);
fadeOut(['#big7', '#scrim'], 2.9, .4);
tl.fromTo('#monQ', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .3, ease: 'power2.out' }, at(2.6));
tl.to('#monA', { opacity: 1, duration: .25 }, at(3.0));
stream($('monText'), '好，以后都按 Helm 来。', at(3.05), .55);
// the turn goes through the gateway and down the conduit…
move(3.7, 980, 900, .62, 1.3);
const m0 = { x: Q.monQ.cx, y: Q.monQ.cy };
tl.set('#monTurn', { left: m0.x, top: m0.y }, at(3.9));
fadeIn('#monTurn', 3.9, .25);
tl.to('#monTurn', { duration: 1.0, ease: 'power2.inOut', motionPath: { path: [{ x: gx - 220 - m0.x, y: 470 - m0.y }, { x: gx - m0.x, y: 560 - m0.y }, { x: gx - m0.x, y: gBot + 60 - m0.y }, { x: gx - m0.x, y: hubTop - m0.y }], curviness: .6 } }, at(4.0));
pulse(at(4.45), 'rgba(79,214,240,.95)', true, .55);
hubPulse(at(5.0));
tl.to('#monTurn', { left: Q.deploy.cx, top: Q.deploy.cy - 30, x: 0, y: 0, duration: .45, ease: 'power2.inOut' }, at(5.0));
// …and settles as a preference memory
tl.to('#monTurn', { opacity: 0, scale: .5, duration: .25 }, at(5.4));
tl.set('#helmCard', { left: Q.deploy.cx - 300, top: Q.deploy.y - 190, scale: .3 }, at(5.4));
tl.to('#helmCard', { opacity: 1, scale: 1, duration: .35, ease: 'back.out(1.6)' }, at(5.4));
tl.to('#f_deploymd', { borderColor: '#4FD6F0', boxShadow: '0 0 0 10px rgba(79,214,240,.18)', duration: .3 }, at(5.5));
// Wednesday, in the ops bot: a different app, the same person
const Y = { x: -640, y: 820, w: 600, h: 470 };
tl.set('#appYw', { height: Y.h }, at(5.4));
tl.set('#ywDay', { textContent: '周三 · 运维 Bot' }, at(5.4));
fadeIn(['#appYw', '#ywChat', '#ywDay', '#ywGw'], 5.6, .5);
move(5.5, 420, 940, .74, 1.3);
tl.to('#helmCard', { scale: .8, opacity: .85, duration: .5 }, at(6.0));
tl.fromTo('#ywQ', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .3, ease: 'power2.out' }, at(6.3));
const r0 = { x: Y.x + Y.w, y: Y.y + 200 };
tl.set('#ywReq', { left: r0.x, top: r0.y }, at(6.5));
fadeIn('#ywReq', 6.5, .2);
tl.to('#ywReq', { duration: .8, ease: 'power2.inOut', motionPath: { path: [{ x: 400, y: -60 }, { x: gx - 160 - r0.x, y: 600 - r0.y }], curviness: .9 } }, at(6.5));
tl.to('#ywReq', { opacity: 0, duration: .15 }, at(7.25));
tag('tagRecall', at(7.2), 1.4);
pulse(at(7.25), 'rgba(79,214,240,.95)', true, .45);
hubPulse(at(7.65));
// the same memory rides up to the gateway and into this conversation
const h0 = { x: Q.deploy.cx - 300, y: Q.deploy.y - 190 };
tl.to('#helmCard', { duration: .8, ease: 'power2.inOut', scale: .45, opacity: 1,
  motionPath: { path: [{ x: gx - 300 - h0.x, y: hubTop - 150 - h0.y }, { x: gx - 300 - h0.x, y: gBot - 130 - h0.y }], curviness: .6 } }, at(7.7));
pulse(at(7.7), 'rgba(79,214,240,.95)', false, .6);
tl.to('#helmCard', { opacity: 0, duration: .2 }, at(8.45));
tl.set('#ywRep', { left: gx - 140, top: 640 }, at(8.45));
fadeIn('#ywRep', 8.45, .2);
tl.to('#ywRep', { duration: .7, ease: 'power2.inOut', motionPath: { path: [{ x: -500, y: 120 }, { x: Y.x + 300 - (gx - 140), y: Y.y + 330 - 640 }], curviness: .8 } }, at(8.5));
tl.to('#ywRep', { opacity: 0, duration: .2 }, at(9.15));
tl.to('#ywA', { opacity: 1, duration: .25 }, at(9.1));
stream($('ywText'), '按你的习惯，直接用 Helm。chart 可以这样组织……', at(9.2), 1.0);
tl.to('#f_deploymd', { borderColor: 'rgba(7,9,13,.07)', boxShadow: '0 2px 10px rgba(7,9,13,.05)', duration: .5 }, at(9.6));

// =====================================================================
// 08 · 交给团队 (11–29): up to the gateway's console
// =====================================================================
hud(10.9, 'OpenViking 网关 · <b>交给团队</b>');
fadeOut('#ctag', 10.6, .4);
move(10.6, 1020, -1150, .9, 1.9);
fadeIn('#console', 11.0, .6);
fadeIn('#cloudChip', 11.7, .4);
// "开通即用，无需部署"
tl.fromTo('#conRun', { opacity: 0, scale: .7 }, { opacity: 1, scale: 1, duration: .3, ease: 'back.out(2)' }, at(13.3));
tl.to('#cloudChip', { boxShadow: '0 0 0 8px rgba(79,214,240,.2), 0 18px 48px rgba(7,9,13,.08)', duration: .3, yoyo: true, repeat: 1 }, at(14.6));
// "全团队一个地址"
tl.to('#conAddr', { borderColor: '#4FD6F0', boxShadow: '0 0 0 6px rgba(79,214,240,.18)', duration: .3 }, at(15.9));
tl.fromTo('#big8', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, at(15.95));
// "服务商密钥留在网关"
tl.to('#conAddr', { borderColor: '#E4E4E7', boxShadow: 'none', duration: .3 }, at(17.3));
tl.set('#tabUp', { attr: { class: 'on' } }, at(17.4)); tl.set('#tabKey', { attr: { class: '' } }, at(17.4));
fadeOut('#pKeys', 17.4, .2); fadeIn('#pUp', 17.45, .25);
tl.to(['#key1', '#key2'], { backgroundColor: 'rgba(79,214,240,.12)', duration: .3, stagger: .15, yoyo: true, repeat: 1 }, at(17.9));
// "每人一把网关密钥，随时吊销"
tl.set('#tabUp', { attr: { class: '' } }, at(19.15)); tl.set('#tabKey', { attr: { class: 'on' } }, at(19.15));
fadeOut('#pUp', 19.15, .2); fadeIn('#pKeys', 19.2, .25);
const cur = (t, x, y, d = .45) => tl.to('#conCur', { left: x, top: y, duration: d, ease: 'power2.inOut' }, at(t));
tl.set('#conCur', { left: 760, top: 520 }, at(19.3));
fadeIn('#conCur', 19.3, .2);
cur(19.35, 1172, 300);
tl.to('#conIssue', { scale: .94, duration: .08, yoyo: true, repeat: 1 }, at(19.85));
tl.fromTo('#dlg', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .25 }, at(19.95));
[['dv1', 'ci-bot'], ['dv2', 'ci-bot（服务账号）'], ['dv3', '不存回 · 无工具'], ['dv4', 'openai']].forEach(([id, v], i) => stream($(id), v, at(20.05 + i * .16), .16));
cur(20.1, 960, 520, .45);
tl.to('#dlgBtn', { scale: .94, duration: .08, yoyo: true, repeat: 1 }, at(20.7));
fadeOut('#dlg', 20.78, .18);
tl.fromTo('#kr3', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: .35, ease: 'power3.out' }, at(20.85));
tl.fromTo('#kr3 td', { backgroundColor: 'rgba(79,214,240,.12)' }, { backgroundColor: 'rgba(79,214,240,0)', duration: 1.2, immediateRender: false }, at(21.2));
cur(20.95, 1218, 590, .45);
tl.to('#kr1 td', { backgroundColor: 'rgba(180,35,24,.05)', duration: .2 }, at(21.4));
fadeOut('#big8', 21.7, .4);
// "记忆按人隔离": a quick tilt down to the store, where each person's memory sits in its own lane
move(21.9, gx, 1380, .58, 1.3);
fadeOut('#conCur', 21.9, .2);
tl.to(['#laneL', '#laneR'], { opacity: 1, duration: .5, stagger: .15 }, at(22.6));
tl.to('#helmCard', { opacity: 0, duration: .1 }, at(21.9));
// the right lane shows qiaoan's own files, not linxia's
const qiaoan = [['f_gateway7d21', 'gateway-2b7c'], ['f_gateway5c0e', 'gateway-91ad'], ['f_sessions2', 'gateway-e40f'],
                ['f_releasechecklistmd', 'refund-faq.md'], ['f_paymentrunbookmd', 'kf-scripts.md'], ['f_apiguidemd', 'sla-policy.md']];
const swapCards = (t, toQiaoan) => qiaoan.forEach(([id, name]) => {
  const el = $(id);
  // f_sessions2 only gets its content during shot 06, so restore what 06 wrote rather than the empty slot
  const orig = id === 'f_sessions2' ? '<div class="n" style="color:#0A7C93">gateway-0f3a</div><div class="l"></div><div class="l s"></div>' : el.innerHTML;
  tl.to(el, { opacity: 0, duration: .2 }, at(t));
  tl.set(el, { innerHTML: toQiaoan ? `<div class="n" style="color:#5E52B8">${name}</div><div class="l"></div><div class="l s"></div>` : orig,
    borderColor: toQiaoan ? 'rgba(139,128,217,.35)' : 'rgba(7,9,13,.07)', background: '#fff' }, at(t + .2));
  tl.to(el, { opacity: 1, duration: .25 }, at(t + .2));
});
swapCards(22.75, true);
swapCards(28.7, false);
// "日志不存对话内容": the gateway's request log keeps metadata only
tl.set('#logCard', { left: gx + 140, top: 640 }, at(23.9));
tl.fromTo('#logCard', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .4, ease: 'power3.out' }, at(23.95));
tl.to('#logEmpty', { borderColor: '#4FD6F0', color: '#0A7C93', duration: .3, yoyo: true, repeat: 1 }, at(24.6));
// "安全和隐私都有保障": the value line lands over the store and the log
fadeIn('#scrim', 25.4, .5);
tl.fromTo('#big9', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, at(25.5));
fadeOut(['#big9', '#scrim'], 28.3, .4);
move(23.8, gx + 470, 900, .92, 1.1);

// =====================================================================
// 09 · 收束 (29–39): two roads, one memory store
// =====================================================================
hud(28.7, '');
fadeOut('#hud', 28.6, .3);
fadeOut(['#logCard', '#laneL', '#laneR', '#console', '#cloudChip'], 28.6, .6);
move(28.6, 300, 900, .42, 2.0);
tl.set(['#appKf'], { height: 330, filter: 'blur(0px)', scale: 1 }, at(28.6));
tl.set(['#kfChat', '#kfSlots', '#kfDay', '#kfNoPlug', '#kfAddr'], { opacity: 0 }, at(28.6));
fadeIn(['#appKf', '#plug'], 29.0, .8);
gsap.set('.plugbadge', { opacity: 1 });
const plugRoad = line(`M-760 640 C -400 1100, ${gx - 900} ${hubC + 40}, ${gx - 260} ${hubC}`, 'rgba(14,154,182,.4)', 4, { 'stroke-dasharray': '3 12' });
plugRoad.style.opacity = 0; tl.to(plugRoad, { opacity: 1, duration: .8 }, at(29.4));
// one last message makes the loop
W.insertAdjacentHTML('beforeend', '<div class="loop" id="lp1">请求</div><div class="loop lmem" id="lp2">请求 + 记忆</div><div class="loop lmem" id="lp3">回复</div>');
gsap.set(['#lp1', '#lp2', '#lp3'], { xPercent: -50, yPercent: -50 });
tl.set('#lp1', { left: 860, top: 530 }, at(30.0)); fadeIn('#lp1', 30.0, .2);
tl.to('#lp1', { left: gx - 120, top: 560, duration: .7, ease: 'power2.inOut' }, at(30.0));
fadeOut('#lp1', 30.65, .15);
pulse(at(30.7), 'rgba(79,214,240,.95)', true, .45); hubPulse(at(31.1));
tl.set('#lp2', { left: gx + 160, top: 560 }, at(30.9)); fadeIn('#lp2', 30.9, .2);
tl.to('#lp2', { left: Q.model.x - 100, duration: .6, ease: 'power2.inOut' }, at(30.9));
fadeOut('#lp2', 31.45, .15);
tl.set('#lp3', { left: Q.model.x - 100, top: 620 }, at(31.7)); fadeIn('#lp3', 31.7, .2);
tl.to('#lp3', { left: 860, top: 600, duration: 1.0, ease: 'power2.inOut' }, at(31.7));
fadeOut('#lp3', 32.65, .15);
pulse(at(32.1), 'rgba(79,214,240,.8)', true, .5); hubPulse(at(32.55));
// to paper white, and the product lands
fadeIn('#paper', 32.6, .8);
tl.fromTo('#lock .l1', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .7, ease: 'power3.out' }, at(32.95));
tl.fromTo('#lock .l3', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, at(33.3));
tl.fromTo('#lock .l2', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, at(34.0));
tl.to({}, { duration: Math.max(0, at(39) - tl.duration()) });

addCaptions('seq07-09', T);
window.__duration = 39;
window.__seek = (t) => { tl.seek(T + t, false); };
window.__seek(0);
</script>
</body></html>
